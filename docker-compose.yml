services:

  localstack:
    image: localstack/localstack:3.0.0
    container_name: localstack-devsecops

    ports:
      - "5566:4566"

    environment:
      - SERVICES=s3,iam
      - DEBUG=1
      - PERSISTENCE=1

    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"